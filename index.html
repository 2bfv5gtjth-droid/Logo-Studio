${list}

Geef ALLEEN JSON: {"teksten":{"T1":"nieuwe tekst","T2":"..."}}.
Regels: schrijf in het Nederlands, concreet en realistisch (verzin passende voorbeeldnamen, plaatsen, prijzen en data). Houd elke tekst ongeveer even lang als het origineel (hooguit 20% langer) en behoud hetzelfde aantal regels (gebruik \\n). Laat opsommingstekens (•) staan. Neem elke id op.`;
  try{

let asst={msgs:[],busy:false,ctl:null,input:''},coachTips=[];
const ASST_CHIPS=['Maak de tekst beter leesbaar','Zet een slogan onder de naam','Voeg een passend icoon toe','Maak het strakker en minimalistischer','Geef het een retro-uitstraling','Kies andere kleuren die goed samengaan','Maak alles iets groter en gecentreerd'];
const r1=v=>Math.round(v*10)/10;
function layerJSON(o,i){
  const b={id:'L'+(i+1),type:o.type,x:r1(o.x),y:r1(o.y),w:r1(o.w),h:r1(o.h)};
  if(o.rot) b.rot=r1(o.rot);
  if(o.opacity<1) b.opacity=o.opacity;
  if(o.hidden) b.hidden=true;
  if(o.type==='text'){Object.assign(b,{text:o.text,font:o.font,size:r1(o.size),fill:o.fill,align:o.align});if(o.ls) b.ls=r1(o.ls);if(o.curve) b.curve=o.curve;}
  else if(o.type==='shape'){b.shape=o.shape;b.fill=o.fill;if(o.shape==='icon'){b.icon=o.icon;b.p=o.p;}else if(o.p) b.p=o.p;}
  else b.note='afbeelding';
  if(o.sw){b.stroke=o.stroke;b.sw=r1(o.sw);}
  if(o.shadow) b.shadow=true;
  if(o.glow) b.glow=o.glow;
  return b;
}
const OP_KEYS=['x','y','w','h','rot','opacity','text','font','size','ls','curve','align','fill','stroke','sw','shadow','glow','hidden','p','icon','shape','iconFill'];
function applyOps(ops){
  const map={};S.objs.forEach((o,i)=>{map['L'+(i+1)]=o;});
  let n=0;
  ops.slice(0,40).forEach(op=>{
    if(!op||typeof op!=='object') return;
    if(op.op==='set'&&map[op.id]&&op.props&&typeof op.props==='object'){
      const o=map[op.id],raw=JSON.parse(JSON.stringify(o));
      Object.keys(op.props).forEach(k=>{
        if(!OP_KEYS.includes(k)) return;
        if(k==='fill'&&op.props.fill&&typeof op.props.fill==='object') raw.fill={...raw.fill,...op.props.fill};
        else raw[k]=op.props[k];
      });
      const c=cleanObj(raw,S.imgs);
      if(c){Object.keys(c).forEach(k=>{if(k!=='id'&&k!=='gid'&&k!=='src') o[k]=c[k];});n++;}
    }else if(op.op==='add'&&op.obj&&typeof op.obj==='object'&&op.obj.type!=='image'){
      const c=cleanObj(op.obj,{});
      if(c){
        c.x=clamp(c.x,-50,S.W+50);c.y=clamp(c.y,-50,S.H+50);
        if(c.type==='text'&&c.w>S.W*.95){c.size=Math.max(10,c.size*S.W*.9/c.w);refreshText(c);}
        const at=op.after&&map[op.after]?S.objs.indexOf(map[op.after])+1:S.objs.length;
        S.objs.splice(at,0,c);n++;
      }
    }else if(op.op==='delete'&&map[op.id]){S.objs=S.objs.filter(q=>q!==map[op.id]);n++;}
    else if(op.op==='bg'&&typeof op.color==='string'&&HEX.test(op.color)){S.bg=op.color;S.bgMode='solid';n++;}
    else if(op.op==='canvas'){resizeDoc(Math.round(num(op.w,S.W,100,4000)),Math.round(num(op.h,S.H,100,4000)));n++;}
  });
  S.objs.forEach(o=>o.type==='text'&&refreshText(o));
  return n;
}
function openAsst(){$('#adock').hidden=false;renderAsst();}
function closeAsst(){if(asst.ctl){try{asst.ctl.abort();}catch(e){}}$('#adock').hidden=true;}
function renderAsst(){
  const d=$('#adock');if(d.hidden) return;
  const last=asst.msgs.length?asst.msgs[asst.msgs.length-1]:null;
  const msgs=asst.msgs.slice(-5).map(m=>`<div class="am ${m.r}${m.err?' err':''}">${esc(m.t)}</div>`).join('');
  d.innerHTML=`<div class="ahead"><b>${ico('ai',16)} AI-assistent</b><span>${last&&last.r==='a'&&last.n?`<button type="button" class="link" data-as="undo">Ongedaan maken</button>`:''}<button class="ib sm" type="button" data-as="close" aria-label="Sluiten">${ico('close',18)}</button></span></div>
  <div class="amsgs" id="amsgs">${msgs||'<div class="am a">Zeg wat je wilt veranderen, bijvoorbeeld “maak de naam groter en zet een ster erboven”.</div>'}${asst.busy?'<div class="am a"><span class="dotsl"></span> Bezig met aanpassen…</div>':''}</div>
  <div class="hs" style="margin:2px 0 6px">${ASST_CHIPS.map((t,i)=>`<button type="button" class="fchip t" data-as="chip" data-i="${i}">${esc(t)}</button>`).join('')}</div>
  <div class="arow"><input id="asin" class="inp" placeholder="Wat moet de AI aanpassen?" maxlength="240" value="${esc(asst.input)}" autocomplete="off">${asst.busy?'<button type="button" class="btn sm" data-as="stop">Stop</button>':'<button type="button" class="btn primary sm" data-as="send">Stuur</button>'}</div>`;
  const m=$('#amsgs');if(m) m.scrollTop=m.scrollHeight;
}
async function runAssistant(instr){
  instr=String(instr||'').trim();
  if(!instr||asst.busy) return;
  const s=await getSample();
  openAsst();
  if(!s){asst.msgs.push({r:'a',t:'AI is hier niet beschikbaar.',err:true});renderAsst();return;}
  if(!S.objs.length&&!/voeg|maak|teken|ontwerp/i.test(instr)){asst.msgs.push({r:'a',t:'Het doek is nog leeg. Vraag bijvoorbeeld om iets toe te voegen.'});renderAsst();return;}
  asst.msgs.push({r:'u',t:instr});asst.input='';asst.busy=true;renderAsst();
  const ctl=new AbortController();asst.ctl=ctl;
  const layers=S.objs.slice(0,60).map(layerJSON);
  const prev=asst.msgs.filter(m=>m.r==='u').slice(-4,-1).map(m=>m.t);
  const prompt=`Je bent de ontwerp-assistent in een logo- en ontwerpapp. Je past het ontwerp aan volgens de opdracht van de gebruiker.
Canvas: ${S.W} x ${S.H} pixels, achtergrond ${S.bg||'transparant'}.
Lagen van achter naar voor (JSON, elk met een id):
${layers.map(l=>JSON.stringify(l)).join('\n')}

Beschikbare vormen: ${SHAPES.map(s=>s[0]).join(', ')}.
Iconen (shape "icon", kleur in fill.c1, p = lijndikte 1 tot 3): ${Object.keys(ICONLIB).join(', ')}.
Lettertypes: ${FONTS.map(f=>f.n).join(', ')}.
${prev.length?'Eerdere opdrachten in dit gesprek: '+prev.join(' | ')+'\n':''}Opdracht: "${instr.replace(/"/g,"'")}"

Geef ALLEEN JSON terug: {"uitleg":"korte samenvatting in het Nederlands van wat je deed (max 2 zinnen)","ops":[...]}.
Toegestane ops:
{"op":"set","id":"L3","props":{...}}  props mogen bevatten: x,y,w,h,rot,opacity,text,font,size,ls,curve,align,fill,stroke,sw,shadow,glow,hidden,p,icon,shape
{"op":"add","obj":{...}}  nieuwe laag met dezelfde velden als hierboven (type shape of text), komt bovenop; optioneel "after":"L2"
{"op":"delete","id":"L4"}
{"op":"bg","color":"#rrggbb"}
{"op":"canvas","w":1080,"h":1080}
Regels: x en y zijn het midden van een laag. Houd alles binnen het canvas en tekst binnen 90% van de breedte. Zorg voor goed contrast tussen tekst en achtergrond. Verander alleen wat nodig is voor de opdracht en behoud de rest. Bij kleuren: gebruik 6-cijferige hex-codes en laat kleuren goed samengaan. Maximaal 30 ops.`;
  try{
    const d=await s.json(prompt,{signal:ctl.signal});
    const ops=Array.isArray(d&&d.ops)?d.ops:[];
    const n=applyOps(ops);
    if(n>0){clearSel();commit();updateQuick();render();buildPanel();}
    asst.msgs.push({r:'a',t:String((d&&d.uitleg)||'Klaar.').slice(0,300)+(n?'':' (Er is niets aangepast.)'),n});
  }catch(e){
    if(e&&e.code==='cancelled') asst.msgs.push({r:'a',t:'Gestopt.'});
    else asst.msgs.push({r:'a',t:aiMsg(e),err:true});
  }
  asst.busy=false;asst.ctl=null;renderAsst();
}
$('#adock').addEventListener('input',e=>{if(e.target.id==='asin') asst.input=e.target.value;});
$('#adock').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='asin'){e.preventDefault();runAssistant(asst.input);}});
$('#adock').addEventListener('click',e=>{
  const b=e.target.closest('[data-as]');if(!b) return;
  const a=b.dataset.as;
  if(a==='close') closeAsst();
  else if(a==='send') runAssistant(($('#asin')?$('#asin').value:asst.input));
  else if(a==='chip') runAssistant(ASST_CHIPS[+b.dataset.i]);
  else if(a==='stop'){if(asst.ctl){try{asst.ctl.abort();}catch(x){}}}
  else if(a==='undo'){undo();const l=asst.msgs[asst.msgs.length-1];if(l) l.n=0;asst.msgs.push({r:'a',t:'Teruggezet.'});renderAsst();}
});

/* ontwerpcoach */
function describeDesign(){
  return S.objs.filter(o=>!o.hidden).slice(0,40).map((o,i)=>{
    if(o.type==='text') return `${i+1}. tekst "${String(o.text).replace(/\n/g,' / ').slice(0,40)}", lettertype ${o.font}, grootte ${Math.round(o.size)}, kleur ${o.fill.t==='none'?'geen (contour)':o.fill.c1}, midden op ${Math.round(o.x)},${Math.round(o.y)}`;
    if(o.type==='image') return `${i+1}. afbeelding ${Math.round(o.w)}x${Math.round(o.h)} op ${Math.round(o.x)},${Math.round(o.y)}`;
    return `${i+1}. vorm ${nameOf(o)} ${Math.round(o.w)}x${Math.round(o.h)} op ${Math.round(o.x)},${Math.round(o.y)}, kleur ${o.fill.t==='none'?'geen':o.fill.c1}`;
  }).join('\n');
}
const ovHead=t=>`<div class="ovh"><h3>${t}</h3><button type="button" class="ib" data-ov="close" aria-label="Sluiten">${ico('close')}</button></div>`;
async function coach(){
  if(!S.objs.length){toast('Er staat nog niets op je doek.');return;}
  const s=await getSample();
  if(!s){ovc.innerHTML=ovHead('Ontwerpcoach')+`<p class="hint">De ontwerpcoach gebruikt AI en die is hier niet beschikbaar.</p>`;showOv();return;}
  const ctl=new AbortController();coachCtl=ctl;
  ovc.innerHTML=ovHead('Ontwerpcoach')+`<div style="padding:8px 0"><div class="skl" style="height:64px;width:64px;border-radius:50%;margin:6px auto 14px"></div><div class="skl"></div><div class="skl s"></div><div class="skl"></div></div><p class="hint" style="text-align:center">De coach bekijkt je ontwerp…</p>`;
  showOv();
  const opts={signal:ctl.signal};
  try{
    if(sampleImgs){const c=renderExport(clamp(800/Math.max(S.W,S.H),.2,2),true,true);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(b) opts.images=b;}
    const prompt=`Je bent een vriendelijke ontwerpcoach voor beginners. Beoordeel dit ontwerp (${S.name}, canvas ${S.W}x${S.H}, achtergrond ${S.bg||'transparant'}).
${opts.images?'Je ziet ook een afbeelding van het ontwerp.\n':''}Onderdelen van achter naar voor:
${describeDesign()}

Geef ALLEEN JSON: {"score":<getal 1 tot 10>,"samenvatting":"één zin","goed":["..",".."],"beter":["..",".."],"snelle_fix":"één concrete actie die de maker nu kan doen"}.
Schrijf in het Nederlands, eenvoudig en bemoedigend, maximaal 22 woorden per punt. Let op leesbaarheid, contrast, ruimte, uitlijning en hoeveel lettertypes en kleuren er gebruikt zijn.`;
    const d=await s.json(prompt,opts);
    if(coachCtl!==ctl) return;
    const li=(a,c)=>`<ul class="clist ${c}">${(Array.isArray(a)?a:[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    ovc.innerHTML=ovHead('Ontwerpcoach')+`<div class="score">${esc(Math.round(num(d.score,7,1,10)))}</div><p class="hint" style="text-align:center;margin-top:0">${esc(d.samenvatting||'')}</p>
      <div class="sec">Dit gaat goed</div>${li(d.goed,'')}<div class="sec">Dit kan beter</div>${li(d.beter,'b')}
      ${d.snelle_fix?`<div class="tipbox"><b>Snelle fix:</b> ${esc(d.snelle_fix)}</div>`:''}
      <button type="button" class="btn primary big" style="margin-top:12px" data-coach="apply">${ico('ai',20)} Pas de tips toe met AI</button>`;
    coachTips=[...(Array.isArray(d.beter)?d.beter.slice(0,4):[]),d.snelle_fix].filter(x=>typeof x==='string'&&x);
  }catch(e){
    if(coachCtl===ctl&&(!e||e.code!=='cancelled')) ovc.innerHTML=ovHead('Ontwerpcoach')+`<p class="hint">${esc(aiMsg(e))}</p>`;
  }
}

function colorsFromPixels(d){
  const m=new Map();
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<128) continue;
    const k=((d[i]>>4)<<8)|((d[i+1]>>4)<<4)|(d[i+2]>>4);let b=m.get(k);
    if(!b){b={n:0,r:0,g:0,b:0};m.set(k,b);}
    b.n++;b.r+=d[i];b.g+=d[i+1];b.b+=d[i+2];
  }
  const arr=[...m.values()].map(b=>({n:b.n,r:b.r/b.n,g:b.g/b.n,b:b.b/b.n})).sort((a,b)=>b.n-a.n),picked=[];
  for(const c of arr){if(picked.every(p=>Math.hypot(p.r-c.r,p.g-c.g,p.b-c.b)>70)) picked.push(c);if(picked.length>=6) break;}
  const hx=v=>Math.round(v).toString(16).padStart(2,'0');
  return picked.map(c=>'#'+hx(c.r)+hx(c.g)+hx(c.b));
}
function paletteFromImageFile(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{
        const c=document.createElement('canvas'),sc=Math.min(1,64/Math.max(im.naturalWidth,im.naturalHeight));
        c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
        const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
        try{res(colorsFromPixels(g.getImageData(0,0,c.width,c.height).data));}catch(e){rej(e);}
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function resizeDoc(nw,nh){
  const old={W:S.W,H:S.H};
  if(settings.rescale&&S.objs.length){
    const k=Math.min(nw/S.W,nh/S.H);
    S.objs.forEach(o=>{
      const full=o.type==='shape'&&o.w>=old.W*.95&&o.h>=old.H*.95&&Math.abs(o.rot||0)<1;
      if(full){o.w=nw;o.h=nh;o.x=nw/2;o.y=nh/2;return;}
      o.x=nw/2+(o.x-old.W/2)*k;o.y=nh/2+(o.y-old.H/2)*k;o.w*=k;o.h*=k;o.sw=(o.sw||0)*k;
      if(o.type==='text'){o.size=Math.max(6,o.size*k);o.ls=(o.ls||0)*k;}
    });
    S.W=nw;S.H=nh;S.objs.forEach(o=>o.type==='text'&&refreshText(o));
  }else{S.W=nw;S.H=nh;recenter(old);}
}

/* ontwerpcontrole */
const relLum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255);};
const contrastRatio=(a,b)=>{const x=relLum(a),y=relLum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
function rbox(o){const r=(o.rot||0)*Math.PI/180,c=Math.abs(Math.cos(r)),s=Math.abs(Math.sin(r)),w=o.w*c+o.h*s,h=o.w*s+o.h*c;return [o.x-w/2,o.y-h/2,o.x+w/2,o.y+h/2];}
function underColor(o){
  const i=S.objs.indexOf(o);
  for(let j=i-1;j>=0;j--){
    const q=S.objs[j];
    if(q.hidden||q.type!=='shape'||q.fill.t!=='solid'||q.shape==='ring'||q.opacity<.6) continue;
    if(Math.abs(o.x-q.x)<=q.w/2&&Math.abs(o.y-q.y)<=q.h/2) return q.fill.c1;
  }
  return S.bg;
}
function designBounds(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false;
  S.objs.forEach(o=>{
    if(o.hidden) return;
    const [a,b,c,d]=rbox(o),m=(o.sw||0)/2+((o.glow||o.shadow)?40:0);
    x0=Math.min(x0,a-m);y0=Math.min(y0,b-m);x1=Math.max(x1,c+m);y1=Math.max(y1,d+m);any=true;
  });
  if(!any) return null;
  const pad=Math.max(S.W,S.H)*.03;
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(S.W,x1+pad);y1=Math.min(S.H,y1+pad);
  return (x1-x0<10||y1-y0<10)?null:{x0,y0,x1,y1};
}

  const g=c.getContext('2d');g.drawImage(im,0,0);

  const px=d.data,c1=hexRgb(o.fill.c1),c2=hexRgb(o.fill.c2);
  for(let i=0;i<px.length;i+=4){
    if(!px[i+3]) continue;
    const r=px[i],gg=px[i+1],b=px[i+2],l=.299*r+.587*gg+.114*b;
    if(f==='gray'){px[i]=px[i+1]=px[i+2]=l;}
    else if(f==='sepia'){px[i]=Math.min(255,.393*r+.769*gg+.189*b);px[i+1]=Math.min(255,.349*r+.686*gg+.168*b);px[i+2]=Math.min(255,.272*r+.534*gg+.131*b);}

    else if(f==='tint'){px[i]=c1[0];px[i+1]=c1[1];px[i+2]=c1[2];}
  }

}
