<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logo Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3a4bff">
<meta name="description" content="Maak logo’s, CV’s, posters en meer op je telefoon.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="color-scheme" content="light dark">
<title>Logo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Anton&family=Bebas+Neue&family=Bungee&family=Cinzel:wght@700&family=DM+Sans:wght@400;700&family=Lobster&family=Lora:wght@400&family=Montserrat:wght@800&family=Orbitron:wght@800&family=Oswald:wght@600&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@800&family=Poppins:wght@600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#dde1e9; --dot:#c9ced9; --panel:#ffffff; --ink:#151924; --muted:#667085; --line:#e4e7ee;
  --chip:#f0f2f7; --accent:#3a4bff; --onaccent:#ffffff; --danger:#d92d4b; --pink:#ff5fa2;
  --ui:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#0e1016; --dot:#1e2230; --panel:#181b24; --ink:#eef0f6; --muted:#98a0b3; --line:#282d3a;
    --chip:#232735; --accent:#7484ff; --onaccent:#0b0e18; --danger:#ff6b81;
  }
}
:root[data-theme="dark"]{
  --stage:#0e1016; --dot:#1e2230; --panel:#181b24; --ink:#eef0f6; --muted:#98a0b3; --line:#282d3a;
  --chip:#232735; --accent:#7484ff; --onaccent:#0b0e18; --danger:#ff6b81;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden;overscroll-behavior:none}
body{height:100%;margin:0;background:var(--panel);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

header{flex:none;height:50px;display:flex;align-items:center;gap:0;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:11px;background:none;color:var(--ink);padding:0;flex:none}
.ib:disabled{opacity:.3}
.ib:active:not(:disabled){background:var(--chip)}
.ib.sm{width:34px;height:34px;border-radius:9px}
.title{flex:1;min-width:0;height:40px;border:0;background:none;font-weight:600;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.cta{height:36px;padding:0 14px;border:0;border-radius:11px;background:var(--accent);color:var(--onaccent);font-weight:600;font-size:13px;flex:none}
.cta:active{filter:brightness(.92)}

#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--stage);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px;touch-action:none}
#cv{position:absolute;inset:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;box-shadow:0 2px 8px rgba(10,15,30,.12)}
#toast{position:fixed;z-index:90;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-14px);max-width:86%;padding:10px 15px;border-radius:13px;background:var(--ink);color:var(--panel);
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center;line-height:1.35}
#toast.show{opacity:1;transform:translate(-50%,0)}
#quick{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:safe center;gap:2px;overflow-x:auto;padding:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(10,15,30,.18);width:max-content;max-width:calc(100% - 20px);margin:0 auto;scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
#quick[hidden]{display:none}
#quick button{flex:none;width:58px;height:50px;border:0;border-radius:11px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--ink)}
#quick button:active{background:var(--chip)}
#quick button.dng{color:var(--danger)}

#sheet{flex:none;height:0;overflow:hidden;background:var(--panel);transition:height .18s ease}
#sheet.open{height:36vh;height:clamp(210px,36dvh,360px);overflow-y:auto;overflow-x:hidden;padding:4px 14px 20px;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){#sheet,#toast{transition:none}}
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);height:58px;background:var(--panel);border-top:1px solid var(--line)}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:0}
#tabs button.on{color:var(--accent)}

.sec{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.sec.first{margin-top:10px}
.hint,.empty{color:var(--muted);font-size:12.5px;line-height:1.5;margin:8px 0}
.empty{padding:26px 8px;text-align:center;font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:44px;border:0;border-radius:12px;background:var(--chip);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:34px;font-size:12.5px;padding:0 12px}
.btn.big{height:52px;font-size:15px;width:100%;border-radius:15px}
.btn:active{filter:brightness(.94)}
.inp,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;margin-bottom:8px;resize:none}
.inp.big{font-size:20px;padding:14px 14px;font-weight:600}
textarea{line-height:1.3}

.shapes{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.shp{aspect-ratio:1;border:0;border-radius:12px;background:var(--chip);display:grid;place-items:center;padding:0}
.shp canvas{width:68%;height:68%}
.shp:active{background:var(--line)}
.stick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.stick button{aspect-ratio:1;border:0;border-radius:12px;background:var(--chip);font-size:26px;padding:0;line-height:1}
.stick button:active{background:var(--line)}

.row{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:8px;min-height:38px}
.row span{font-size:12.5px;color:var(--muted)}
.row output{font-size:12px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:30px;accent-color:var(--accent);margin:0;touch-action:pan-y}
.cf{margin:6px 0 4px}
.cf>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(128,128,140,.35);padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;margin-bottom:6px}
.seg button{flex:1;height:34px;border:0;background:none;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);display:grid;place-items:center;padding:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(10,15,30,.15)}
.seg button:disabled{opacity:.35}
.tog{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:none;font-weight:600;font-size:13px;text-align:left;padding:0 14px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tog::after{content:'';width:34px;height:20px;border-radius:12px;background:var(--line);transition:background .15s;
  background-image:radial-gradient(circle at 10px 10px,#fff 7px,transparent 7.5px);background-repeat:no-repeat}
.tog.on::after{background-color:var(--accent);background-image:radial-gradient(circle at 24px 10px,#fff 7px,transparent 7.5px)}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;border-radius:11px;background:var(--chip);padding:9px 14px;font-size:18px;white-space:nowrap}
.fchip.on{outline:2px solid var(--accent)}
.fchip.t{font-size:13px;font-weight:600;font-family:var(--ui);padding:10px 14px}
.lrow{display:flex;align-items:center;gap:2px;min-height:50px;border-bottom:1px solid var(--line);border-radius:10px;padding:0 2px 0 8px}
.lrow.on{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.lname{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;height:50px}
.lname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.off .lname{opacity:.45}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow img{width:48px;height:48px;border-radius:9px;object-fit:contain;background:var(--chip)}
.pn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.pn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn small{color:var(--muted);font-size:11.5px}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left}
.pal .sq{display:flex;border-radius:8px;overflow:hidden;height:26px;border:1px solid rgba(128,128,140,.3)}
.pal .sq i{flex:1}
.pal em{font-style:normal;font-size:11.5px;font-weight:600}
.pal:active{background:var(--chip)}

/* overlays */
#ov{position:fixed;inset:0;z-index:70;background:rgba(8,10,18,.55);display:flex;align-items:flex-end;justify-content:center}
#ov[hidden]{display:none}
.card{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.card h3{margin:4px 0 12px;font-size:16px}
.ovh{display:flex;align-items:center;justify-content:space-between}
.ovh h3{margin:0}
.prev{border-radius:14px;overflow:hidden;background:var(--chip);display:grid;place-items:center;height:32vh;height:32dvh;margin:10px 0 4px;padding:10px}
.prev.chk{background-color:#fff;background-image:linear-gradient(45deg,#d6d9e0 25%,transparent 25%,transparent 75%,#d6d9e0 75%),linear-gradient(45deg,#d6d9e0 25%,transparent 25%,transparent 75%,#d6d9e0 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.prev img{max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.sizes{display:grid;gap:8px}
.sizes button{display:flex;justify-content:space-between;align-items:center;height:48px;border:0;border-radius:12px;background:var(--chip);padding:0 14px;font-weight:600;font-size:14px}
.sizes small{color:var(--muted);font-weight:500;font-size:12px}
.tour{text-align:center;padding:10px 6px 2px}
.tour .big{width:76px;height:76px;margin:6px auto 14px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff}
.tour h3{font-size:19px;margin:0 0 8px}
.tour p{margin:0 auto 16px;max-width:320px;color:var(--muted);line-height:1.55;font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:20px;border-radius:5px}

/* schermen */
.screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--panel);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.screen[hidden]{display:none}
#home{z-index:30}
#wiz{z-index:40}
.wrap{max-width:560px;margin:0 auto}
.htop{display:flex;align-items:center;justify-content:space-between;height:46px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.h1{font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:14px 0 16px}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:18px;padding:10px 12px;margin-bottom:12px}
.resume img{width:54px;height:54px;border-radius:11px;object-fit:contain;background:var(--panel);border:1px solid var(--line)}
.resume b{display:block;font-size:14px}
.resume small{color:var(--muted);font-size:12px}
.hero{display:grid;gap:10px}
.hcard{border:0;border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:5px;color:#fff;position:relative;overflow:hidden}
.hcard b{font-size:17px;letter-spacing:-.01em}
.hcard span.d{font-size:12.5px;line-height:1.4;opacity:.9;max-width:230px}
.hcard.big{min-height:132px;background:linear-gradient(135deg,#3a4bff 0%,#7b2cbf 55%,#ff5fa2 100%);justify-content:flex-end}
.hcard.big .hic{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.hcard.big::after{content:'';position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hsm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard.dark{background:#151924;min-height:104px;justify-content:flex-end}
.hcard.light{background:var(--chip);color:var(--ink);min-height:104px;justify-content:flex-end}
.hcard svg{margin-bottom:auto}
.hcard:active,.tcard:active,.resume:active{transform:scale(.985)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:none;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px}
.tth{aspect-ratio:1;border-radius:16px;background:var(--stage);display:grid;place-items:center;padding:12px;border:1px solid var(--line)}
.tth img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 6px 16px rgba(10,15,30,.22)}
.tth .ph{width:60%;height:60%;border-radius:8px;background:var(--line)}
.tcard b{font-size:13.5px}
.tcard small{color:var(--muted);font-size:11.5px;margin-top:-5px}

/* wizard */
.whead{display:flex;align-items:center;justify-content:space-between;height:46px;margin-bottom:6px}
.wiz h2{font-size:25px;letter-spacing:-.02em;margin:12px 0 6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sgrid button{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.sgrid button:active{background:var(--chip)}
.sgrid .e{font-size:30px;line-height:1.1;margin-bottom:4px}
.sgrid b{font-size:14px}
.sgrid small{color:var(--muted);font-size:12px}
.wprev{background:var(--stage);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px;border-radius:20px;padding:18px;display:grid;place-items:center;margin:12px 0}
.wprev canvas{width:100%;max-width:340px;aspect-ratio:1;border-radius:6px;box-shadow:0 10px 28px rgba(10,15,30,.3);display:block}
.wact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0b0d1a radial-gradient(circle at 50% 38%,#232a66 0%,#0b0d1a 68%);color:#fff;transition:opacity .45s ease;text-align:center}
#intro.out{opacity:0;pointer-events:none}
#intro .imark{width:132px;height:132px;overflow:visible}
#intro .hex{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.6,0,.2,1) .15s forwards}
#intro .spark{transform-origin:60px 60px;transform:scale(0) rotate(-60deg);animation:pop .7s cubic-bezier(.3,1.5,.5,1) .95s forwards}
#intro .ring{transform-origin:60px 60px;opacity:0;animation:ring 1.1s ease-out 1.05s forwards}
#intro .iname{font-weight:700;font-size:34px;letter-spacing:-.02em;margin-top:22px;display:flex;justify-content:center}
#intro .iname span{display:inline-block;opacity:0;transform:translateY(14px);animation:rise .5s ease-out forwards}
#intro .itag{margin-top:10px;font-size:14px;color:#aab2e6;opacity:0;animation:fade .6s ease 1.9s forwards}
#intro .iskip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:0;right:0;font-size:12px;color:#6d75b8;opacity:0;animation:fade .6s ease 2.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1) rotate(0)}}
@keyframes ring{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #intro .hex{animation:none;stroke-dashoffset:0}
  #intro .spark{animation:none;transform:none}
  #intro .iname span,#intro .itag,#intro .iskip{animation:none;opacity:1;transform:none}
  #intro .ring{display:none}
}
#confetti{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}
/* ===== v3: opmaak en nieuwe onderdelen ===== */
:root{--r:18px;--shadow:0 8px 28px rgba(20,28,60,.14);--grad:linear-gradient(135deg,#3a4bff 0%,#7b2cbf 55%,#ff5fa2 100%)}
header{height:54px;padding:0 8px;gap:2px;background:color-mix(in srgb,var(--panel) 92%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px)}
.cta{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(58,75,255,.35);height:38px;padding:0 16px;border-radius:12px}
#tabs{height:62px;box-shadow:0 -6px 20px rgba(20,28,60,.06)}
#tabs button{position:relative;transition:color .15s}
#tabs button.on::before{content:'';position:absolute;top:0;left:50%;width:26px;margin-left:-13px;height:3px;border-radius:0 0 4px 4px;background:var(--grad)}
#tabs button svg{transition:transform .15s}
#tabs button.on svg{transform:translateY(-1px) scale(1.08)}
#sheet.open{border-radius:20px 20px 0 0;margin-top:-14px;box-shadow:0 -10px 30px rgba(20,28,60,.12);padding-top:8px;position:relative}
#sheet.open::before{content:'';display:block;width:38px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.btn.primary{background:var(--grad);color:#fff}
.sec{letter-spacing:.01em}
.sw.on,.fchip.on{outline-color:var(--accent)}
.card{border-radius:24px 24px 0 0}

/* zijmenu */
#scrim{position:fixed;inset:0;z-index:55;background:rgba(8,10,18,.5);opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:56;background:var(--panel);transform:translateX(-104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 6px) 0 calc(env(safe-area-inset-bottom,0px) + 8px);box-shadow:10px 0 44px rgba(0,0,0,.28);border-radius:0 24px 24px 0}
#drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 6px 18px;height:52px}
.dscroll{flex:1;overflow-y:auto;padding:0 10px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dsec{font-size:11.5px;font-weight:600;color:var(--muted);margin:16px 10px 6px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;height:48px;border:0;background:none;border-radius:14px;padding:0 8px;font-weight:600;font-size:14px;text-align:left}
.ditem:active{background:var(--chip)}
.ditem .di{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--chip);flex:none}
.ditem.ai .di{background:var(--grad);color:#fff}
.badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:9px;background:var(--chip);color:var(--accent)}
.ditem.ai .badge{background:var(--grad);color:#fff}
.ditem.t::after{content:'';margin-left:auto;width:36px;height:22px;border-radius:12px;background:var(--line);transition:background .15s;flex:none;
  background-image:radial-gradient(circle at 11px 11px,#fff 8px,transparent 8.5px);background-repeat:no-repeat}
.ditem.t.on::after{background-color:var(--accent);background-image:radial-gradient(circle at 25px 11px,#fff 8px,transparent 8.5px)}

/* startscherm */
.lft{display:flex;align-items:center;gap:2px}
.h1{font-size:30px;margin:10px 0 16px}
.hcard.aic{min-height:160px;background:var(--grad);background-size:220% 220%;animation:gshift 9s ease infinite;justify-content:flex-end;width:100%;margin-bottom:10px;border-radius:26px;box-shadow:0 12px 30px rgba(90,60,220,.35)}
.hcard.aic b{font-size:22px;letter-spacing:-.02em}
.hcard.aic .hic{position:absolute;top:16px;right:16px;width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.hcard.aic .pill{position:absolute;top:20px;left:18px;font-size:11px;font-weight:700;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:10px}
.hcard.aic::after{content:'';position:absolute;right:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.13)}
@keyframes gshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){.hcard.aic{animation:none}}
.hsm3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcard.sm{min-height:112px;padding:13px;border-radius:20px;justify-content:flex-end}
.hcard.sm b{font-size:14px}
.hcard.sm.c1{background:linear-gradient(140deg,#1b9e4b,#2ec4b6)}
.hcard.sm.c2{background:linear-gradient(140deg,#ff8c1a,#e63946)}
.hcard.sm.c3{background:linear-gradient(140deg,#151924,#3b4468)}
.brief{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 12px 12px 16px;border-radius:20px;background:var(--chip);border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line))}
.brief small{display:block;font-size:11.5px;font-weight:600;color:var(--accent);margin-bottom:3px}
.brief b{font-size:13.5px;line-height:1.35;display:block}
.bact{display:flex;align-items:center;gap:4px;flex:none}
.tth{border-radius:18px}
.tcard:active .tth{transform:scale(.98)}

/* AI-scherm */
#ai{z-index:42}
#mock{z-index:48}
.aititle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.aititle svg{color:var(--accent)}
.ah{font-size:24px;letter-spacing:-.02em;margin:10px 0 6px;line-height:1.2}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.concept{border:1px solid var(--line);border-radius:20px;padding:8px;background:var(--panel);display:flex;flex-direction:column;gap:6px;text-align:left}
.concept canvas,.concept .skel{width:100%;aspect-ratio:1;border-radius:13px;background:var(--chip);display:block}
.concept b{font-size:13.5px;padding:0 4px}
.concept small{color:var(--muted);font-size:11.5px;line-height:1.4;padding:0 4px;min-height:16px}
.concept.wide{grid-column:1/-1}
.concept.wide canvas{max-width:340px;margin:0 auto}
.skel,.skl{position:relative;overflow:hidden}
.skel::after,.skl::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shim 1.3s infinite}
@keyframes shim{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.skel::after,.skl::after{animation:none}}
.skl{height:12px;border-radius:6px;background:var(--chip);margin:2px 4px}
.skl.s{width:60%}
.aihelp{display:flex;gap:8px;margin:6px 0}
.aihelp .inp{margin:0;flex:1}
.aiw{display:flex;gap:8px;margin-top:6px}
.aiw .inp{margin:0;flex:1;font-size:15px;padding:8px 12px}
.aiw .btn{flex:none}
.mstage{background:var(--stage);border-radius:22px;padding:8px;display:grid;place-items:center}
.mstage img{width:100%;max-width:520px;aspect-ratio:1;border-radius:16px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.score{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:30px;color:#fff;background:var(--grad);margin:4px auto 10px;box-shadow:0 8px 22px rgba(90,60,220,.35)}
.clist{margin:6px 0 10px;padding:0;list-style:none;display:grid;gap:7px}
.clist li{display:flex;gap:9px;font-size:13.5px;line-height:1.45;align-items:flex-start}
.clist li::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:#1b9e4b}
.clist.b li::before{background:#ff8c1a}
.tipbox{background:var(--chip);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:6px}
/* ===== v4: paletten en extra's ===== */
.btn:disabled{opacity:.4;pointer-events:none}
.sws2{margin-top:8px;gap:7px}
.sws2 em{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);flex-basis:100%;margin-bottom:-1px}
.sw.fav{border-radius:9px}
.sw.plus{display:grid;place-items:center;font-size:19px;font-weight:600;background:var(--chip);color:var(--muted);line-height:1}
.palw{position:relative}
.palw .pal{width:100%}
.pale{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:9px;border:0;background:var(--chip);display:grid;place-items:center;padding:0;color:var(--muted)}
.peslots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.peslot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.pesw{width:100%;aspect-ratio:1;border-radius:16px;border:1px solid rgba(128,128,140,.35);display:block}
.peslot input[type=color]{position:absolute;left:0;top:0;width:100%;height:calc(100% - 24px);opacity:0;border:0;padding:0;border-radius:16px}
.peslot em{font-style:normal;font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.pprev canvas{width:100%;max-width:210px;aspect-ratio:1;border-radius:16px;display:block;margin:0 auto 6px;border:1px solid var(--line)}
.dcols{display:flex;flex-wrap:wrap;gap:10px}
.dcol{position:relative;width:46px;height:46px;display:block}
.dcol span{position:absolute;inset:0;border-radius:14px;border:1px solid rgba(128,128,140,.35)}
.dcol input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;border-radius:14px}
.msq{display:flex;border-radius:9px;overflow:hidden;height:30px;width:120px;flex:none;border:1px solid rgba(128,128,140,.3)}
.msq i{flex:1}
.search{margin:0 0 12px;border-radius:14px}
.clist .btn.sm{flex:none}
/* ===== v5: soepel scrollen, favorieten, foto's, elementen ===== */
#drawer:not(.on){box-shadow:none;visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
.hcard.aic{animation:none;background-size:100% 100%;box-shadow:0 8px 20px rgba(90,60,220,.28)}
.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.tw{min-width:0}
.tcard{min-width:0;width:100%}
.tw{position:relative}
.tth{background:var(--stage);position:relative;display:block;padding:0;--pad:24px;overflow:hidden}
.rc .tth{--pad:16px}
.tth img{position:absolute;inset:0;margin:auto;max-width:calc(100% - var(--pad));max-height:calc(100% - var(--pad));border-radius:4px;box-shadow:0 1px 4px rgba(10,15,30,.28);background:var(--line);opacity:0;transition:opacity .18s}
.tth img.on{opacity:1;background:none}
.prev img{width:100%;height:100%;object-fit:contain;max-width:none;max-height:none}
#quick button{white-space:nowrap;font-size:9.5px}
.heartb{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#8a92a6;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(10,15,30,.25)}
.heartb.on{color:#e63946}
.heartb.on svg{fill:currentColor}
.rrow{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.rrow::-webkit-scrollbar{display:none}
.rc{flex:none;width:98px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.rc .tth{border-radius:14px}
.rc b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.elb{border:0;border-radius:13px;background:var(--chip);padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600}
.elb canvas{width:100%;aspect-ratio:1;display:block}
.elb:active{background:var(--line)}
.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hst{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;font-weight:600}
.hst img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--chip);border-radius:8px}
.hst.now{border-color:var(--accent);color:var(--accent)}
.qrrow{display:flex;gap:8px}
.qrrow .inp{margin:0;flex:1;font-size:15px;padding:10px 12px}
/* ===== v6: bibliotheek, meerdere selecteren, AI-assistent ===== */
#mbar{position:absolute;top:10px;left:10px;display:flex;gap:6px}
#mbar button{height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(10,15,30,.12)}
#mbar button[hidden]{display:none}
#mbar button.on{background:var(--accent);color:var(--onaccent);border-color:transparent}
#zoom button.aifab{background:var(--accent);color:var(--onaccent);border-color:transparent}
.seg.s5 button{font-size:11.5px}
.tplgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tplgrid .elb{padding:6px;text-align:center}
.tplgrid .elb .tt{width:100%;aspect-ratio:1;border-radius:9px;background:var(--stage);position:relative;overflow:hidden}
.tplgrid .elb .tt img{position:absolute;inset:0;margin:auto;max-width:88%;max-height:88%;box-shadow:0 1px 3px rgba(10,15,30,.3)}
.gtag{flex:none;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--accent);margin-left:6px}
.aiopt{height:auto;min-height:44px;padding:10px 12px;text-align:left;justify-content:flex-start;margin-top:6px;font-weight:500;font-size:13px;line-height:1.35;white-space:normal}
#adock{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px 8px;box-shadow:0 6px 18px rgba(20,28,60,.08);position:relative;z-index:3}
#adock[hidden]{display:none}
.ahead{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.ahead b{display:flex;align-items:center;gap:6px;color:var(--accent)}
.ahead span{display:flex;align-items:center;gap:4px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:4px 6px}
.amsgs{max-height:92px;overflow-y:auto;margin:4px 0;display:flex;flex-direction:column;gap:5px}
.am{font-size:12.5px;line-height:1.4;padding:6px 10px;border-radius:12px;max-width:92%}
.am.u{align-self:flex-end;background:var(--accent);color:var(--onaccent)}
.am.a{align-self:flex-start;background:var(--chip)}
.am.err{background:color-mix(in srgb,var(--danger) 14%,var(--panel));color:var(--danger)}
.arow{display:flex;gap:8px;align-items:center}
.arow .inp{margin:0;flex:1;font-size:15px;padding:9px 12px}
.arow .btn{flex:none}
.dotsl{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dotsl{animation:none}}
[data-noai] .aifab,[data-noai] [data-d="asst"],[data-noai] [data-d="fill"],[data-noai] [data-d="coach"]{display:none!important}
</style>

<script>
/* Zelfstandige versie: geen Claude-omgeving, dus bewaren via het deelmenu en zonder AI */
(function(){
  if(window.claude) return;
  document.documentElement.setAttribute('data-noai','1');
  const dlAPI={save:async function(o){
    const filename=o.filename,data=o.data;
    const type=/\.json$/i.test(filename)?'application/json':/\.pdf$/i.test(filename)?'application/pdf':/\.jpe?g$/i.test(filename)?'image/jpeg':'image/png';
    const blob=data instanceof Blob?data:new Blob([data],{type:type});
    const file=new File([blob],filename,{type:blob.type||type});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
    }catch(e){
      if(e&&e.name==='AbortError'){const er=new Error('declined');er.code='declined';throw er;}
    }
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }};
  window.claude={use:async function(n){if(n==='downloads') return dlAPI;throw new Error('unavailable');}};
})();
</script>

const mctx=document.createElement('canvas').getContext('2d');
function measureLine(g,o,str){
  g.font=fontStr(o);
  if(!o.ls) return g.measureText(str).width;
  let w=0; const ch=[...str]; ch.forEach(c=>{w+=g.measureText(c).width;}); return w+o.ls*Math.max(0,ch.length-1);
}
function textSize(o){
  const lines=String(o.text||'').split('\n'),lh=o.size*(o.lh||1.12);let mw=0;
  lines.forEach(l=>{mw=Math.max(mw,measureLine(mctx,o,l));});
  let w=Math.max(mw,o.size*.4),h=Math.max(1,lines.length)*lh;
  const cu=lines.length===1?(o.curve||0):0;
  if(Math.abs(cu)>=3&&mw>0){
    const th=Math.abs(cu)/100*Math.PI,R=mw/th;
    w=Math.max(2*(R+lh/2)*Math.sin(Math.min(th/2,Math.PI/2)),o.size*.4);h=lh+R*(1-Math.cos(th/2));
  }
  return {w,h,mw};
}
function refreshText(o){
  const ow=o.w,d=textSize(o);o.w=d.w;o.h=d.h;
  if(typeof ow==='number'&&ow!==d.w&&(o.align==='left'||o.align==='right')){
    const sh=(d.w-ow)/2*(o.align==='left'?1:-1),r=(o.rot||0)*Math.PI/180;o.x+=sh*Math.cos(r);o.y+=sh*Math.sin(r);
  }
}

/* ---------- geschiedenis en opslag ---------- */
let hist=[],hi=-1,saveT=null;
const snap=()=>JSON.stringify({W:S.W,H:S.H,bg:S.bg,bgMode:S.bgMode,bg2:S.bg2,objs:S.objs,name:S.name});
function commit(){
  const s=snap(); if(hist[hi]===s) return;
  hist=hist.slice(0,hi+1); hist.push(s); if(hist.length>80) hist.shift(); hi=hist.length-1;
  scheduleSave(); updateUndo();
}
function restore(s){
  const d=JSON.parse(s); S.W=d.W;S.H=d.H;S.bg=d.bg;S.bgMode=d.bgMode||'solid';S.bg2=d.bg2||'#e4e7ee';S.objs=d.objs;S.name=d.name;
  S.objs.forEach(o=>o.type==='text'&&refreshText(o));
  pruneSel();
  if(autoFit) fit();
  setTitle(); updateQuick(); render(); buildPanel(); updateUndo(); scheduleSave();
}
const undo=()=>{if(hi>0){hi--;restore(hist[hi]);}};
const redo=()=>{if(hi<hist.length-1){hi++;restore(hist[hi]);}};
function updateUndo(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1;}
function setTitle(){$('#title').textContent=S.name;}

function serialize(){
  const imgs={}; S.objs.forEach(o=>{if(o.type==='image'&&S.imgs[o.src]) imgs[o.src]=S.imgs[o.src];});
  return {v:3,W:S.W,H:S.H,bg:S.bg,bgMode:S.bgMode,bg2:S.bg2,name:S.name,objs:S.objs,imgs};
}
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(doAutosave,700);}
function doAutosave(){
  if(!editorOpen||!S.objs.length) return;
  try{
    localStorage.setItem(KEY_AUTO,JSON.stringify(serialize()));
    localStorage.setItem(KEY_META,JSON.stringify({name:S.name,t:Date.now(),thumb:renderExport(140/Math.max(S.W,S.H),true,true).toDataURL('image/png')}));
  }catch(e){ if(!warned){warned=true;toast('Automatisch bewaren mislukt: opslag vol. Bewaar je project als bestand.',4000);} }
}
function readList(){try{return JSON.parse(localStorage.getItem(KEY_LIST)||'[]');}catch(e){return [];}}
function writeList(l){try{localStorage.setItem(KEY_LIST,JSON.stringify(l));return true;}catch(e){return false;}}
function readMeta(){try{const m=JSON.parse(localStorage.getItem(KEY_META)||'null');return m&&localStorage.getItem(KEY_AUTO)?m:null;}catch(e){return null;}}

function cleanObj(r,imgs){
  if(!r||typeof r!=='object') return null;
  if(!['shape','text','image'].includes(r.type)) return null;
  const f=r.fill&&typeof r.fill==='object'?r.fill:{};
  const o={id:uid(),type:r.type,x:num(r.x,S.W/2,-9000,9000),y:num(r.y,S.H/2,-9000,9000),w:num(r.w,300,4,9000),h:num(r.h,300,4,9000),
    rot:num(r.rot,0,-360,360),opacity:num(r.opacity,1,0,1),hidden:!!r.hidden,locked:!!r.locked,
    fill:{t:['solid','grad','none'].includes(f.t)?f.t:'solid',c1:HEX.test(f.c1)?f.c1:'#151924',c2:HEX.test(f.c2)?f.c2:'#ff5fa2',a:num(f.a,90,-360,360)},
    stroke:HEX.test(r.stroke)?r.stroke:'#151924',sw:num(r.sw,0,0,200),shadow:!!r.shadow,glow:HEX.test(r.glow)?r.glow:false,fx:!!r.fx};
  if(o.type==='shape'){o.shape=(SHAPES.some(s=>s[0]===r.shape)||r.shape==='qr'||r.shape==='icon')?r.shape:'rect';o.p=num(r.p,defP(o.shape),0,30);if(o.shape==='qr') o.data=String(r.data||'').slice(0,200);if(o.shape==='icon'){o.icon=ICONLIB[r.icon]?r.icon:'star';o.iconFill=!!r.iconFill;}}
  if(typeof r.gid==='string'&&/^g[\w-]{1,24}$/.test(r.gid)) o.gid=r.gid;

function snapOrigs(list){return new Map(list.map(o=>[o.id,{x:o.x,y:o.y,w:o.w,h:o.h,size:o.size,ls:o.ls,rot:o.rot,sw:o.sw||0}]));}
cv.addEventListener('pointerdown',e=>{

    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,c0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:view.z,ox0:view.ox,oy0:view.oy};

      }else if(ids.includes(hit.id)){wasSel=true;}
      else if(hit.gid&&inGroup!==hit.gid){setSelection(groupMembers(hit).map(o=>o.id));inGroup=null;updateQuick();if(tab==='style'||tab==='layers'||tab==='add'){if(tab==='add') tab='style';buildPanel();}}
      else{setSelection([hit.id]);inGroup=hit.gid||null;updateQuick();if(tab==='style'||tab==='layers'||tab==='add'){if(tab==='add') tab='style';buildPanel();}}

cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  const p=pos(e);ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const nz=clamp(pinch.z0*d/pinch.d0,.03,10),lx=(pinch.c0.x-pinch.ox0)/pinch.z0,ly=(pinch.c0.y-pinch.oy0)/pinch.z0;
    view.z=nz;view.ox=c.x-lx*nz;view.oy=c.y-ly*nz;render();return;
  }
  if(!drag) return;
  const dx=p.x-drag.start.x,dy=p.y-drag.start.y;
  if(!drag.moved){if(Math.hypot(dx,dy)<5) return;drag.moved=true;}
  const list=drag.list,box=drag.box;
  if(drag.mode==='pan'){view.ox=drag.pan0.ox+dx;view.oy=drag.pan0.oy+dy;autoFit=false;}
  else if(drag.mode==='marquee'){marquee.x1=p.x;marquee.y1=p.y;}
  else if(list.length&&drag.mode==='move'){
    let mx=dx/view.z,my=dy/view.z;const th=settings.snap?7/view.z:-1;guides={v:false,h:false};
    if(Math.abs(box.cx+mx-S.W/2)<th){mx=S.W/2-box.cx;guides.v=true;}
    if(Math.abs(box.cy+my-S.H/2)<th){my=S.H/2-box.cy;guides.h=true;}
    list.forEach(o=>{const g=drag.origs.get(o.id);o.x=g.x+mx;o.y=g.y+my;});
  }else if(list.length&&drag.mode==='scale'){
    const s=toScr(box.cx,box.cy),f=clamp(Math.hypot(p.x-s.x,p.y-s.y)/drag.d0,.05,30);
    list.forEach(o=>{
      const g=drag.origs.get(o.id);
      o.x=box.cx+(g.x-box.cx)*f;o.y=box.cy+(g.y-box.cy)*f;o.sw=g.sw*f;
      if(o.type==='text'){o.size=clamp(g.size*f,6,3000);o.ls=(g.ls||0)*f;o.w=g.w*f;o.h=g.h*f;refreshText(o);}
      else{o.w=clamp(g.w*f,4,9000);o.h=clamp(g.h*f,4,9000);}

  }else if(list.length&&drag.mode==='rotate'){
    const s=toScr(box.cx,box.cy);

      const o=list[0];let a=Math.atan2(p.y-s.y,p.x-s.x)*180/Math.PI+90;
      a=((a+540)%360)-180;const sn=Math.round(a/15)*15;if(Math.abs(a-sn)<4) a=sn;o.rot=a;
    }else{
      let da=(Math.atan2(p.y-s.y,p.x-s.x)-drag.a0)*180/Math.PI;const sn=Math.round(da/15)*15;if(Math.abs(da-sn)<4) da=sn;
      const r=da*Math.PI/180,cs=Math.cos(r),sn2=Math.sin(r);

      });
    }

});
function selectByRect(m){
  const a=toLog({x:Math.min(m.x0,m.x1),y:Math.min(m.y0,m.y1)}),b=toLog({x:Math.max(m.x0,m.x1),y:Math.max(m.y0,m.y1)});
  const ids=new Set(selIds());
  S.objs.forEach(o=>{
    if(o.hidden||o.locked) return;
    const [x0,y0,x1,y1]=rbox(o);
    if(x1>=a.x&&x0<=b.x&&y1>=a.y&&y0<=b.y) groupMembers(o).forEach(g=>ids.add(g.id));
  });
  setSelection([...ids]);
}
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;

  if(!drag) return;
  const d=drag;drag=null;guides={v:false,h:false};
  if(d.mode==='marquee'){
    const m=marquee;marquee=null;

  }
  if(d.moved&&d.mode!=='pan'){commit();if(tab==='style'||tab==='layers') buildPanel();}

    if(d.mode==='pan'){if(selIds().length){clearSel();updateQuick();if(tab==='style'&&autoOpened){tab=null;autoOpened=false;}buildPanel();}}
    else if(d.mode==='move'){

      if(multiMode&&d.wasSel&&ho){

        setSelection([ho.id]);inGroup=ho.gid;updateQuick();buildPanel();render();return;
      }
      if(!multiMode&&tab!=='layers'&&tab!=='style'){autoOpened=!tab;tab='style';}

function drawSel(){
  const list=selList().filter(o=>!o.hidden);
  if(list.length===1){
    const o=list[0],s=toScr(o.x,o.y),hw=o.w*view.z/2,hh=o.h*view.z/2;
    X.save();X.translate(s.x,s.y);X.rotate(o.rot*Math.PI/180);
    X.strokeStyle=ACC;X.lineWidth=1.5;
    if(o.locked){X.setLineDash([5,4]);X.strokeRect(-hw,-hh,hw*2,hh*2);X.restore();}
    else{
      X.strokeRect(-hw,-hh,hw*2,hh*2);
      X.beginPath();X.moveTo(0,-hh);X.lineTo(0,-hh-ROT_OFF);X.stroke();
      const dot=(x,y)=>{X.beginPath();X.arc(x,y,9,0,Math.PI*2);X.fillStyle='#fff';X.fill();X.lineWidth=2;X.strokeStyle=ACC;X.stroke();};

      X.restore();
    }
  }else if(list.length>1){
    X.save();X.strokeStyle=ACC;X.globalAlpha=.55;X.lineWidth=1;
    list.forEach(o=>{const s=toScr(o.x,o.y),hw=o.w*view.z/2,hh=o.h*view.z/2;X.save();X.translate(s.x,s.y);X.rotate(o.rot*Math.PI/180);X.strokeRect(-hw,-hh,hw*2,hh*2);X.restore();});
    X.restore();
    const b=selBounds(list),s=toScr(b.cx,b.cy),hw=b.w*view.z/2,hh=b.h*view.z/2;
    X.save();X.translate(s.x,s.y);X.strokeStyle=ACC;X.lineWidth=1.5;X.setLineDash([6,4]);X.strokeRect(-hw,-hh,hw*2,hh*2);X.setLineDash([]);
    if(!list.some(o=>o.locked)){
      X.beginPath();X.moveTo(0,-hh);X.lineTo(0,-hh-ROT_OFF);X.stroke();
      const dot=(x,y)=>{X.beginPath();X.arc(x,y,9,0,Math.PI*2);X.fillStyle='#fff';X.fill();X.lineWidth=2;X.strokeStyle=ACC;X.stroke();};
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,c])=>dot(a*hw,c*hh));dot(0,-hh-ROT_OFF);

  }
}

/* acties op de selectie */
function dupSel(list){
  const gmap={};
  const clones=list.map(o=>{
    const c=JSON.parse(JSON.stringify(o));c.id=uid();c.x+=30;c.y+=30;c.locked=false;
    if(c.gid){gmap[c.gid]=gmap[c.gid]||('g'+uid());c.gid=gmap[c.gid];}
    return c;
  });
  const last=Math.max(...list.map(o=>S.objs.indexOf(o)));
  S.objs.splice(last+1,0,...clones);setSelection(clones.map(c=>c.id));
}
function delSel(list){
  S.objs=S.objs.filter(x=>!list.includes(x));clearSel();
  if(tab==='style'&&autoOpened){tab=null;autoOpened=false;}
}
function flipSel(list){
  if(list.length===1){list[0].fx=!list[0].fx;return;}
  const b=selBounds(list);
  list.forEach(o=>{o.x=2*b.cx-o.x;o.rot=-(o.rot||0);o.fx=!o.fx;});
}
function shiftSel(list,dx,dy){list.forEach(o=>{o.x+=dx;o.y+=dy;});}
function toGroupSel(list){
  if(list.length<2) return;
  const allSame=list.every(o=>o.gid&&o.gid===list[0].gid);
  if(allSame){list.forEach(o=>{delete o.gid;});inGroup=null;toast('Groep opgeheven');}
  else{const g='g'+uid();list.forEach(o=>{o.gid=g;});toast('Gegroepeerd. Tik op één onderdeel om het los te bewerken.',3000);}
}
function alignSel(list,k){
  const b=selBounds(list),ref=alignRef==='doek'?{x0:0,y0:0,x1:S.W,y1:S.H,cx:S.W/2,cy:S.H/2}:b;
  list.forEach(o=>{
    const [a,bb,c,d]=rbox(o);
    if(k==='l') o.x+=ref.x0-a;else if(k==='ch') o.x+=ref.cx-(a+c)/2;else if(k==='r') o.x+=ref.x1-c;
    else if(k==='t') o.y+=ref.y0-bb;else if(k==='cv') o.y+=ref.cy-(bb+d)/2;else if(k==='b') o.y+=ref.y1-d;
  });
}
function distSel(list,axis){
  if(list.length<3) return;
  const c=o=>{const [a,b,cc,d]=rbox(o);return axis==='h'?(a+cc)/2:(b+d)/2;};
  const s=[...list].sort((p,q)=>c(p)-c(q)),first=c(s[0]),last=c(s[s.length-1]),step=(last-first)/(s.length-1);
  s.forEach((o,i)=>{const dlt=first+step*i-c(o);if(axis==='h') o.x+=dlt;else o.y+=dlt;});
}
$('#quick').addEventListener('click',e=>{
  const b=e.target.closest('[data-q]');const list=selList();if(!b||!list.length) return;

   case 'dup': dupSel(list);break;
   case 'del': delSel(list);break;
   case 'front':{const ord=S.objs.filter(x=>list.includes(x));S.objs=S.objs.filter(x=>!list.includes(x)).concat(ord);break;}
   case 'back':{const ord=S.objs.filter(x=>list.includes(x));S.objs=ord.concat(S.objs.filter(x=>!list.includes(x)));break;}
   case 'flip': flipSel(list);break;
   case 'ch': shiftSel(list,S.W/2-selBounds(list).cx,0);break;
   case 'cv': shiftSel(list,0,S.H/2-selBounds(list).cy);break;
   case 'group':

function importImage(file){
  if(!file) return;
  if(file.size>30e6){toast('Deze afbeelding is te groot (max 30 MB).');return;}
  const fr=new FileReader();
  fr.onerror=()=>toast('Kon de afbeelding niet lezen.');
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Dit bestand is geen geldige afbeelding.');
    im.onload=()=>{
      const m=1400,sc=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight));
      const w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      let url;try{url=file.type==='image/jpeg'?c.toDataURL('image/jpeg',.9):c.toDataURL('image/png');}catch(e){toast('Afbeelding verwerken mislukt.');return;}
      const key='img'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      S.imgs[key]=url;
      const f=Math.min(S.W,S.H)*.6/Math.max(w,h);
      const tg=photoTarget?S.objs.find(q=>q.id===photoTarget):null;photoTarget=null;

function nameOf(o){

  if(o.type==='image') return 'Afbeelding';
  if(o.shape==='qr') return 'QR-code';

  return (SHAPES.find(s=>s[0]===o.shape)||['','Vorm'])[1];

function move(o,to){

const isNeutral=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return Math.max(r,g,b)-Math.min(r,g,b)<40&&(lum(h)<.16||lum(h)>.9);};
function applyTheme(p){
  const oldDark=S.bg?lum(S.bg)<.45:false,newDark=lum(p.bg)<.45,flip=oldDark!==newDark;
  const cnt=new Map();
  const cols=o=>{const r=[];if(o.type==='image') return r;if(o.fill.t!=='none'){r.push(['fill.c1',o.fill.c1]);if(o.fill.t==='grad') r.push(['fill.c2',o.fill.c2]);}if(o.sw>0) r.push(['stroke',o.stroke]);if(o.glow) r.push(['glow',o.glow]);return r;};
  S.objs.forEach(o=>cols(o).forEach(([,c])=>{const k=c.toLowerCase();if(!isNeutral(k)) cnt.set(k,(cnt.get(k)||0)+1);}));
  const order=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]),cyc=[p.p1,p.p2,p.ac],map={};
  order.forEach((c,i)=>{map[c]=cyc[i%3];});
  const set=(o,path,v)=>{const a=path.split('.');let t=o;for(let i=0;i<a.length-1;i++) t=t[a[i]];t[a[a.length-1]]=v;};
  S.objs.forEach(o=>cols(o).forEach(([path,c])=>{
    const k=c.toLowerCase();let nv=c;
    if(map[k]) nv=map[k];
    else if(flip&&isNeutral(k)) nv=lum(k)<.5?'#ffffff':'#151924';
    set(o,path,nv);
  }));
  if(S.bg){S.bg=p.bg;S.bg2=hexMix(p.bg,p.p2,.28);}
  commit();render();buildPanel();toast('Kleurthema “'+p.n+'” toegepast');
}
const TSTYLES=[['plain','Normaal'],['outline','Contour'],['shadow','Schaduw'],['sticker','Sticker'],['glow','Gloed'],['gold','Goud']];
function textPreset(o,k){
  const base=o.fill.t==='none'?o.stroke:o.fill.c1;
  o.shadow=false;o.glow=false;o.sw=0;
  if(o.fill.t!=='grad'||k!=='plain'){}
  if(o.fill.t==='none'){o.fill.t='solid';o.fill.c1=base;}
  switch(k){
   case 'outline': o.stroke=base;o.fill.t='none';o.sw=Math.max(4,Math.round(o.size*.03));break;
   case 'shadow': o.shadow=true;break;
   case 'sticker': o.stroke=lum(base)>.6?'#151924':'#ffffff';o.sw=Math.max(6,Math.round(o.size*.06));o.shadow=true;break;
   case 'glow': o.fill.t='solid';o.glow=base;break;
   case 'gold': o.fill={t:'grad',c1:'#f9e08b',c2:'#b8860b',a:90};o.shadow=true;break;
  }
  refreshText(o);
}

const PANELS={add:pAdd,style:pStyle,layers:pLayers,canvas:pCanvas,file:pFile};
function syncTabs(){$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));}
function buildPanel(){
  syncTabs();
  if(!tab){sheet.classList.remove('open');sheet.innerHTML='';sheet.dataset.t='';return;}
  const keep=sheet.dataset.t===tab?sheet.scrollTop:0;
  sheet.classList.add('open');sheet.dataset.t=tab;sheet.innerHTML=PANELS[tab]();sheet.scrollTop=keep;
  afterPanel();
}
function afterPanel(){
  drawElPreviews();
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#151924';
  $$('canvas[data-shape]',sheet).forEach(c=>{
    const g=c.getContext('2d'),k=c.dataset.shape;g.translate(60,60);
    const o={shape:k,w:84,h:84,p:defP(k)};shapePath(g,o);g.fillStyle=ink;g.fill(fillRule(k));
  });
  $$('canvas[data-icon]',sheet).forEach(c=>{const g=c.getContext('2d');g.translate(60,60);drawIcon(g,{icon:c.dataset.icon,w:84,h:84,p:2,fill:{c1:ink}});});
}

sheet.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='txt'){const o=getSel();if(o){o.text=t.value;refreshText(o);render();}return;}
  if(t.dataset.dc!==undefined){recolorLive(t);return;}
  const k=t.dataset.k;if(!k) return;
  const val=t.type==='range'?parseFloat(t.value):t.value;
  setVal(k,val);
  if(t.type==='range'){const out=t.nextElementSibling;if(out) out.textContent=fmtVal(t.dataset.f,val);}
});
sheet.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.dc!==undefined){commit();buildPanel();return;}
  if(t.dataset.cv){
    const v=Math.round(num(t.value,S[t.dataset.cv],100,4000));
    resizeDoc(t.dataset.cv==='W'?v:S.W,t.dataset.cv==='H'?v:S.H);commit();if(autoFit) fit();render();buildPanel();return;
  }
  if(t.dataset.name){S.name=t.value.trim().slice(0,40)||'Naamloos logo';setTitle();commit();return;}
  if(t.dataset.k||t.id==='txt'){commit();if(t.id==='txt') buildPanel();}
});
sheet.addEventListener('focusin',e=>{if(e.target.id==='txt'&&e.target.value==='LOGO') e.target.select();});
function setVal(k,val){
  if(k[0]==='*'){
    const pth=k.slice(1).split('.');
    selList().forEach(o=>{
      if(o.type==='image') return;
      if(pth.join('.')==='fill.c1'){if(o.fill.t==='none'&&o.type==='text') o.stroke=val;else{o.fill.c1=val;if(o.fill.t==='none') o.fill.t='solid';}}
      else{let ob=o;for(let i=0;i<pth.length-1;i++) ob=ob[pth[i]];ob[pth[pth.length-1]]=val;}
    });
    render();return;
  }
  const tgt=k[0]==='@'?S:getSel();if(!tgt) return;
  const path=(k[0]==='@'?k.slice(1):k).split('.');let ob=tgt;
  for(let i=0;i<path.length-1;i++) ob=ob[path[i]];
  ob[path[path.length-1]]=val;
  if(tgt!==S&&tgt.shape==='qr'&&(k==='w'||k==='h')){tgt.w=val;tgt.h=val;}
  if(tgt!==S&&tgt.type==='text') refreshText(tgt);
  render();
}
function recenter(old){
  const dx=(S.W-old.W)/2,dy=(S.H-old.H)/2;
  S.objs.forEach(o=>{o.x+=dx;o.y+=dy;});
}
sheet.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b) return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id,o=getSel();
  const byId=S.objs.find(q=>q.id===id);
  switch(a){
   case 'addShape': addShape(v);break;
   case 'addText': addText();break;
   case 'addSticker': addSticker(v);break;
   case 'pickImage': photoTarget=null;imgInput.click();break;
   case 'setc': setVal(b.dataset.k,v);commit();buildPanel();break;
   case 'filltype': if(o){o.fill.t=v;commit();buildPanel();render();}break;
   case 'align': if(o){o.align=v;commit();buildPanel();render();}break;
   case 'shadow': if(o){o.shadow=!o.shadow;if(o.shadow) o.glow=false;commit();buildPanel();render();}break;
   case 'glow': if(o){o.glow=o.glow?false:(o.fill.t==='none'?o.stroke:o.fill.c1);if(o.glow) o.shadow=false;commit();buildPanel();render();}break;
   case 'tstyle': if(o){textPreset(o,v);commit();buildPanel();render();}break;
   case 'font': if(o){
      o.font=v;refreshText(o);render();commit();buildPanel();
      loadFont(fontDef(v)).then(()=>{refreshText(o);render();});
    }break;
   case 'lsel': if(byId){
      if(multiMode){const ids=selIds();setSelection(ids.includes(byId.id)?ids.filter(x=>x!==byId.id):[...ids,byId.id]);updateQuick();buildPanel();render();}
      else select(byId.id);
    }break;
   case 'leye': if(byId){byId.hidden=!byId.hidden;commit();buildPanel();render();}break;
   case 'llock': if(byId){byId.locked=!byId.locked;commit();buildPanel();render();}break;
   case 'lup': if(byId){move(byId,S.objs.indexOf(byId)+1);commit();buildPanel();render();}break;
   case 'ldown': if(byId){move(byId,S.objs.indexOf(byId)-1);commit();buildPanel();render();}break;
   case 'preset':{const p=SIZES[+v];resizeDoc(p[1],p[2]);commit();autoFit=true;fit();render();buildPanel();break;}
   case 'theme': applyTheme(allPals()[+v]||PALS[0]);break;
   case 'bgmode': if(v==='none') S.bg=null;else{S.bg=S.bg||'#ffffff';S.bgMode=v;}commit();buildPanel();render();break;
   case 'rtheme': applyTheme(randomTheme());break;
   case 'newpal': openPalEditor(null,S.objs.length?paletteFromDesign():null);break;
   case 'savepal': openPalEditor(null,paletteFromDesign());break;
   case 'epal': openPalEditor(v);break;
   case 'favadd': favAdd(v);break;
   case 'rescale': settings.rescale=!settings.rescale;saveSettings();buildPanel();break;
   case 'addEl': addElement(+v);break;
   case 'asub': addSub=v;buildPanel();break;
   case 'acat': addCat[addSub]=v;buildPanel();break;
   case 'addIcon': iconAdd(v);break;
   case 'inserttpl': insertTemplate(+v);break;
   case 'iconfill': if(o){o.iconFill=!o.iconFill;commit();buildPanel();render();}break;
   case 'aiopt': if(o&&aiOpts&&aiOpts.id===o.id){o.text=aiOpts.list[+v]||o.text;aiOpts=null;refreshText(o);commit();buildPanel();render();}break;
   case 'gselect': if(o){setSelection(groupMembers(o).map(q=>q.id));inGroup=null;updateQuick();buildPanel();render();}break;
   case 'gungroup': if(o&&o.gid){const g=o.gid;S.objs.forEach(q=>{if(q.gid===g) delete q.gid;});inGroup=null;commit();updateQuick();buildPanel();render();toast('Groep opgeheven');}break;
   case 'mgroup':{toGroupSel(selList());commit();updateQuick();buildPanel();render();break;}
   case 'mdup':{const l=selList();if(l.length){dupSel(l);commit();updateQuick();buildPanel();render();}break;}
   case 'malign':{alignSel(selList(),v);commit();render();break;}
   case 'mref': alignRef=v;buildPanel();break;
   case 'mdist':{distSel(selList(),v);commit();render();break;}
   case 'mflip':{flipSel(selList());commit();render();break;}
   case 'mlock':{selList().forEach(q=>{q.locked=true;});clearSel();commit();updateQuick();buildPanel();render();toast('Vergrendeld. Ontgrendel via Lagen.');break;}
   case 'mdel':{delSel(selList());commit();updateQuick();buildPanel();render();break;}
   case 'addqr': addQR();break;
   case 'photoin': if(o){photoTarget=o.id;imgInput.click();}break;
   case 'imask': if(o){o.mask=v;commit();buildPanel();render();}break;
   case 'icover': if(o){o.cover=v==='1';commit();buildPanel();render();}break;
   case 'ifilter': if(o){o.filter=v;commit();buildPanel();render();}break;
   case 'fitw': if(o&&o.type==='text'){fitTextWidth(o);commit();buildPanel();render();}break;
   case 'copystyle': if(o) copyStyle(o);break;
   case 'pastestyle': if(o&&styleClip){pasteStyle(o);commit();buildPanel();render();}break;
   case 'case': if(o&&o.type==='text'){const t=String(o.text);o.text=v==='up'?t.toUpperCase():v==='low'?t.toLowerCase():t.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());refreshText(o);commit();buildPanel();render();}break;
   case 'aichip': if(o) aiWrite(o,WRITE_CHIPS[+v][1]);break;
   case 'aiwrite':{if(!o) break;const q=($('#aiq')?$('#aiq').value:'').trim();if(q.length<3){toast('Typ eerst kort wat de AI moet schrijven.');break;}aiWrite(o,q);break;}
   case 'align2': if(o){alignTo(o,v);commit();buildPanel();render();}break;
   case 'saveProj': saveProj();break;
   case 'toHome': showHome();break;
   case 'tour': showTour(0);break;
   case 'openProj':{const p=readList().find(q=>q.id===id);if(p){try{loadData(JSON.parse(p.data));S.pid=p.id;toast('Project geopend');}catch(err){toast('Dit project kon niet worden geopend.');}}break;}
   case 'delProj': ask('Dit project verwijderen van dit apparaat?',()=>{writeList(readList().filter(q=>q.id!==id));if(S.pid===id) S.pid=null;buildPanel();},'Verwijder');break;
   case 'expJSON': saveJSON();break;
   case 'impJSON': jsonInput.click();break;
  }
});

  if(/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName)) return;
  if(!$('#home').hidden||!$('#wiz').hidden) return;
  const m=e.metaKey||e.ctrlKey;

let tt=null;
function toast(m,ms=2400){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms);}
const slug=s=>(String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||'ontwerp';
function renderExport(scale,withBg,opaque,crop){
  const cx=crop?crop.x0:0,cy=crop?crop.y0:0,lw=crop?crop.x1-crop.x0:S.W,lh=crop?crop.y1-crop.y0:S.H;
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(lw*scale));c.height=Math.max(1,Math.round(lh*scale));
  const g=c.getContext('2d');
  if(withBg&&S.bg){g.save();g.scale(scale,scale);g.translate(-cx,-cy);drawBackground(g,S.W,S.H);g.restore();}
  else if(opaque){g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);}
  g.scale(scale,scale);g.translate(-cx,-cy);drawScene(g,scale);return c;
}
function saveProj(){
  const list=readList(),thumb=renderExport(160/Math.max(S.W,S.H),true,true).toDataURL('image/png');
  const item={id:S.pid||uid(),name:S.name,t:Date.now(),thumb,data:JSON.stringify(serialize())};
  S.pid=item.id;const i=list.findIndex(p=>p.id===item.id);if(i>=0) list[i]=item;else list.unshift(item);
  if(writeList(list)) toast('Project opgeslagen');else toast('Opslaan mislukt: opslag vol. Bewaar als bestand.',3600);
  buildPanel();
}
async function saveJSON(){
  if(!dl){toast('Bestanden bewaren kan hier niet. Gebruik Opslaan.',3200);return;}
  try{await dl.save({filename:slug(S.name)+'.json',data:JSON.stringify(serialize())});toast('Bestand bewaard');}
  catch(err){if(!err||err.code!=='declined') toast('Bewaren mislukt.');}
}
async function makePDF(c,lw,lh){
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
  if(!blob) throw new Error('jpeg');
  const jpg=new Uint8Array(await blob.arrayBuffer()),enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=u=>{parts.push(u);len+=u.length;},str=s=>push(enc.encode(s));
  const pw=+((lw||S.W)*.48).toFixed(2),ph=+((lh||S.H)*.48).toFixed(2);
  str('%PDF-1.4\n');
  offs[1]=len;str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2]=len;str('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offs[3]=len;str(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  offs[4]=len;str(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);str('\nendstream\nendobj\n');
  const content=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  offs[5]=len;str(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xr=len;str('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++) str(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  str(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

async function doSaveImage(){
  const pdf=ex.fmt==='pdf',jpg=ex.fmt==='jpg'||pdf,cr=ex.crop?designBounds():null;
  const c=renderExport(ex.scale,jpg||ex.bg,jpg,cr);
  try{
    let blob,ext;
    if(pdf){blob=await makePDF(c,cr?cr.x1-cr.x0:S.W,cr?cr.y1-cr.y0:S.H);ext='pdf';}
    else{blob=await new Promise(r=>c.toBlob(r,jpg?'image/jpeg':'image/png',.93));ext=jpg?'jpg':'png';}
    if(!blob){toast('Exporteren mislukt.');return;}
    await dl.save({filename:slug(S.name)+'.'+ext,data:blob});
    toast('Bewaard. Mooi gedaan!');confetti();
  }catch(err){if(!err||err.code!=='declined') toast('Bewaren mislukt. Houd het voorbeeld ingedrukt.',3400);}
}

ov.addEventListener('click',e=>{
  if(e.target===ov){hideOv();return;}
  const b=e.target.closest('[data-ov],[data-ex],[data-tour],[data-size],[data-board],[data-fix],[data-pe],[data-pm],[data-hist],[data-fill],[data-coach]');if(!b) return;

  if(b.dataset.coach){hideOv();openAsst();runAssistant('Verbeter dit ontwerp met deze tips: '+coachTips.join('; '));return;}
  if(b.dataset.size!==undefined){const s=SIZES[+b.dataset.size];hideOv();startBlank(s);return;}
  if(b.dataset.fix!==undefined){
    const it=checkDesign()[+b.dataset.fix];
    if(it&&it.fix){it.fix();commit();updateQuick();buildPanel();render();}
    if(ex) ovc.innerHTML=exHTML();else showCheck();
    return;
  }
  if(b.dataset.hist!==undefined){const i=+b.dataset.hist;hideOv();if(hist[i]){hi=i;restore(hist[hi]);toast('Teruggezet');}return;}
  if(b.dataset.pe){palEditorAction(b.dataset.pe);return;}
  if(b.dataset.pm){palMgrAction(b.dataset.pm,b);return;}
  if(b.dataset.board){
    if(dl){boardCanvas().toBlob(async bl=>{try{await dl.save({filename:slug(S.name)+'-merkbord.png',data:bl});toast('Merkbord bewaard');confetti();}catch(err){if(!err||err.code!=='declined') toast('Bewaren mislukt.');}},'image/png');}
    return;
  }
  if(b.dataset.tour){
    if(b.dataset.tour==='next') showTour(tourI+1);
    else if(b.dataset.tour==='prev') showTour(tourI-1);
    else hideOv();
    return;
  }
  if(b.dataset.ov==='close'){hideOv();return;}
  if(b.dataset.ov==='yes'){const f=ovYes;hideOv();if(f) f();return;}
  if(!ex) return;
  const k=b.dataset.ex,v=b.dataset.v;
  if(k==='save'){doSaveImage();return;}
  if(k==='fmt') ex.fmt=v;
  if(k==='scale') ex.scale=+v;
  if(k==='bg') ex.bg=!ex.bg;
  if(k==='crop') ex.crop=!ex.crop;
  ovc.innerHTML=exHTML();
});

function confetti(){
  if(reduced()) return;
  const c=$('#confetti'),g=c.getContext('2d');c.hidden=false;
  const d=Math.min(window.devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;
  const cols=['#3a4bff','#ff5fa2','#ffd23f','#2ec4b6','#7b2cbf','#ff8c1a'];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.62,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,r:Math.random()*6+3,c:cols[Math.random()*6|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let t0=performance.now();
  (function step(t){
    const el=t-t0;g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.globalAlpha=clamp(1-el/1800,0,1);g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore();});
    if(el<1800) requestAnimationFrame(step);else{g.clearRect(0,0,innerWidth,innerHeight);c.hidden=true;}
  })(t0);
}

function insertTemplate(i){
  const t=TPL[i];
  let objs=t.build().filter(o=>!(o.type==='shape'&&o.w>=t.W*.95&&o.h>=t.H*.95));
  if(!objs.length) objs=t.build();
  const bb=selBounds(objs),k=Math.min(1.6,S.W*.8/bb.w,S.H*.8/bb.h),g='g'+uid();
  objs.forEach(o=>{
    o.x=S.W/2+(o.x-bb.cx)*k;o.y=S.H/2+(o.y-bb.cy)*k;o.w*=k;o.h*=k;o.sw=(o.sw||0)*k;o.gid=g;
    if(o.type==='text'){o.size=Math.max(6,o.size*k);o.ls=(o.ls||0)*k;refreshText(o);}
  });
  S.objs.push(...objs);setSelection(objs.map(o=>o.id));commit();updateQuick();render();buildPanel();
  toast('Sjabloon toegevoegd als groep. Sleep om te verplaatsen.');
}

const ICON_POOL={sport:['trophy','bolt','dumbbell','ball','bike','flame','rocket'],elegant:['wine','star','heart','key','book','flower'],gamer:['bolt','rocket','headphones','flame','target'],
 retro:['coffee','pizza','icecream','burger','music','camera'],minimal:['leaf','sun','mountain','drop','bulb','star'],playful:['heart','star','icecream','cake','music','paw'],
 nature:['leaf','tree','sun','drop','mountain','paw','flower'],luxury:['crown','star','key','wine','bag','diamond'],emblem:['star','crown','anchor','trophy','mountain','tree'],wordmark:[]};
function genLogo(name,slogan,style,pal,v=0,icon){
  const {bg,p1,p2,ac}=pal,tx=on(bg),on1=on(p1),up=name.toUpperCase(),sl=(slogan||'').trim(),out=[];
  const pool=ICON_POOL[style]||[],icn=(icon&&ICONLIB[icon])?icon:(pool.length?pool[v%pool.length]:'star');
  const fitTo=(o,tw)=>{for(let i=0;i<3;i++){refreshText(o);if(o.w>0) o.size=clamp(o.size*tw/o.w,14,420);}refreshText(o);return o;};
  const slg=(font,size,y,color,tw,extra={})=>fitTo(T(sl,font,size,500,y,color,extra),tw);
  switch(style){
   case 'sport':{
    const f=['Bungee','Anton','Oswald'][v%3];
    out.push(R('shield',500,490,760,860,p1,{stroke:p2,sw:24}),R('shield',500,490,640,740,{t:'none'},{stroke:ac,sw:6}),IC(icn,500,290,170,ac,{p:2}));
    out.push(fitTo(T(up,f,120,500,500,on1),520));
    if(sl) out.push(slg('Oswald',50,640,ac,440,{ls:10}));
    break;}
   case 'elegant':{
    const f=['Playfair Display','Cinzel'][v%2];
    out.push(R('ring',500,500,880,880,p1,{p:.014}),R('ring',500,500,820,820,p1,{p:.006}),IC(icn,500,300,56,ac,{p:2}));
    out.push(fitTo(T(f==='Cinzel'?up:name,f,120,500,490,tx,{ls:f==='Cinzel'?8:2}),560));
    out.push(R('rect',500,570,260,4,ac));
    if(sl) out.push(slg('Lora',44,650,vis(bg,p2,tx),420,{ls:8}));
    break;}
   case 'gamer':{
    out.push(R('hexagon',500,400,720,620,G(p1,p2,45)),IC(icn,500,400,300,'#ffffff',{p:1.6,shadow:true}));
    out.push(fitTo(T(up,'Orbitron',150,500,835,tx,{glow:vis(bg,p2,p1)}),800));
    if(sl) out.push(slg('Bebas Neue',56,935,vis(bg,ac,tx),500,{ls:16}));
    break;}
   case 'retro':{
    const f=['Lobster','Pacifico'][v%2];
    out.push(R('burst',500,470,860,860,p2,{p:18}),R('ellipse',500,470,640,640,p1,{stroke:ac,sw:14}),IC(icn,500,290,120,on1,{p:2.2}));
    out.push(fitTo(T(name,f,200,500,sl?470:490,on1),500));
    if(sl){out.push(R('ribbon',500,650,600,170,ac));out.push(slg('Montserrat',44,650,on(ac),400,{ls:6}));}
    break;}
   case 'minimal':{
    out.push(IC(icn,500,330,200,vis(bg,p1,tx),{p:1.6}));
    out.push(fitTo(T(up,'Montserrat',120,500,560,tx,{ls:6}),700));
    if(sl) out.push(slg('DM Sans',42,650,vis(bg,p2,tx),500,{ls:14}));
    out.push(R('rect',500,sl?730:650,120,8,vis(bg,p1,tx)));
    break;}
   case 'playful':{
    const f=['Bungee','Permanent Marker'][v%2];
    out.push(R('burst',500,500,820,820,ac,{p:12}),R('sparkle',200,230,130,130,p2),R('sparkle',810,770,110,110,p2),IC(icn,790,240,130,p1,{p:2.4,rot:12}));
    out.push(fitTo(T(name,f,170,500,sl?470:500,p1,{rot:-6,sw:9,stroke:'#ffffff'}),620));
    if(sl) out.push(slg('Poppins',56,650,on(ac),480,{rot:-6}));
    break;}
   case 'nature':{
    out.push(R('ring',500,470,860,860,p1,{p:.02}),IC(icn,500,330,280,p1,{p:1.6}));
    out.push(fitTo(T(name,'Playfair Display',130,500,640,tx),620));
    if(sl) out.push(slg('Montserrat',40,745,vis(bg,p2,tx),440,{ls:12}));
    break;}
   case 'emblem':{
    const c1=vis(bg,p1,tx);
    out.push(R('ring',500,500,900,900,p1,{p:.045}),R('ring',500,500,780,780,p1,{p:.012}));
    out.push(arcText(up,'Montserrat',345,500,500,true,c1,{ls:4}));
    out.push(arcText(sl?sl.toUpperCase():'EST. 2026','Montserrat',345,500,500,false,vis(bg,p2,tx),{ls:4}));
    out.push(R('star',155,500,56,56,ac),R('star',845,500,56,56,ac),IC(icn,500,500,300,c1,{p:1.6}));
    break;}
   case 'wordmark':{
    const f=['Montserrat','Playfair Display','Bebas Neue','Poppins'][v%4],col=vis(bg,p1,tx);
    out.push(fitTo(T(f==='Playfair Display'?name:up,f,220,500,470,col,{ls:f==='Bebas Neue'?10:0}),820));
    out.push(R('rect',500,sl?600:590,160,14,ac));
    if(sl) out.push(slg('DM Sans',44,690,vis(bg,p2,tx),560,{ls:12}));
    break;}
   default:{
    out.push(IC(icn,500,280,170,ac,{p:1.8}));
    out.push(fitTo(T(up,'Cinzel',110,500,500,vis(bg,p1,tx),{ls:10}),700));
    out.push(R('rect',300,590,190,4,ac),R('rect',700,590,190,4,ac),R('diamond',500,590,26,26,ac));
    if(sl) out.push(slg('Cinzel',40,680,tx,520,{ls:10}));
   }
  }
  return {objs:out,bg};
}

function hexMix(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16),m=(x,y)=>Math.round(x+(y-x)*t);
  const r=m(pa>>16,pb>>16),g=m((pa>>8)&255,(pb>>8)&255),bl=m(pa&255,pb&255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
function hslHex(h,s,l){
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const x=v=>Math.round(255*v).toString(16).padStart(2,'0');return '#'+x(f(0))+x(f(8))+x(f(4));
}
function randomTheme(){
  const h=Math.random()*360,dark=Math.random()<.4;
  return {n:'Willekeurig',bg:dark?hslHex(h,30,10):hslHex(h,25,97),p1:hslHex(h,72,dark?62:36),p2:hslHex((h+40)%360,66,55),ac:hslHex((h+180)%360,88,58)};
}

  if(sampleFn!==null) return sampleFn||null;
  try{
    const s=window.claude&&window.claude.use?await window.claude.use('sample'):null;
    sampleFn=s||false;
    if(s&&s.limits){const l=await s.limits().catch(()=>null);sampleImgs=!!(l&&l.images);}

function paintPreview(c,objs,bg){
  const g=c.getContext('2d'),sc=c.width/1000;
  g.setTransform(1,0,0,1,0,0);g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.scale(sc,sc);
  objs.forEach(o=>drawObj(g,o,sc));
}
const KW=[['sport',/voetbal|sport|team|club|fitness|gym|basket|hockey|tennis|stoer|kracht|skate/i],['gamer',/game|gamer|esport|twitch|neon|ruimte|space|tech|robot|kanaal/i],
 ['retro',/retro|vintage|caf[eé]|koffie|diner|bakkerij|pizzeria|pizza|burger|frituur|ijs|foodtruck/i],['elegant',/elegant|klassiek|bruiloft|restaurant|advocaat|notaris|wijn|fris/i],
 ['luxury',/luxe|goud|juwel|chique|exclusief|premium|hotel|parfum/i],['nature',/natuur|groen|plant|tuin|vegan|bio|yoga|bos|duurzaam|bloem/i],
 ['playful',/speels|kind|kids|vrolijk|feest|snoep|speelgoed|taart|leuk|dans/i],['minimal',/minimal|strak|modern|design|architect|studio|simpel|chic/i]];
function palFor(p,i){
  const m=[[/groen|vegan|natuur|bos|plant/i,'Bos'],[/blauw|zee|water|oceaan/i,'Oceaan'],[/goud|zwart|luxe|juwel/i,'Goud'],[/neon|ruimte|space|game/i,'Neon'],[/roze|pop|snoep|kind/i,'Roze pop'],[/rood|vuur|stoer|pittig/i,'Vuur'],[/zonsondergang|warm|oranje/i,'Zonsondergang']];
  const hit=m.find(x=>x[0].test(p));
  return hit&&i===0?PALS.find(q=>q.n===hit[1]):PALS[(Math.random()*PALS.length)|0];
}
function guessName(p){
  const q=p.match(/["“”'‘’]([^"“”'‘’]{2,24})["“”'‘’]/);
  if(q) return q[1];
  return NAMES[(Math.random()*NAMES.length)|0];
}
function localConcepts(p){
  const hits=KW.filter(k=>k[1].test(p)).map(k=>k[0]);
  const pool=[...new Set([...hits,'minimal','playful','elegant','sport'])].slice(0,3),name=guessName(p);
  return pool.map((s,i)=>({name,slogan:'',style:s,pal:palFor(p,i),why:'Slimme keuze op basis van je woorden.',v:i}));
}
function normConcept(c){
  if(!c||typeof c!=='object') return null;
  const style=STYLES.some(s=>s[0]===c.style)?c.style:'minimal',pl=c.palette||{},base=PALS[(Math.random()*PALS.length)|0];
  const pal={n:'AI',bg:cleanHex(pl.bg,base.bg),p1:cleanHex(pl.p1,base.p1),p2:cleanHex(pl.p2,base.p2),ac:cleanHex(pl.ac,base.ac)};
  if(Math.abs(lum(pal.bg)-lum(pal.p1))<.22) pal.bg=lum(pal.p1)<.5?'#ffffff':'#151924';
  return {name:String(c.name||'').trim().slice(0,24)||'Jouw Merk',slogan:String(c.slogan||'').trim().slice(0,32),style,pal,why:String(c.why||'').slice(0,110),v:0,icon:ICONLIB[c.icon]?c.icon:undefined};
}
function normFree(d){
  if(!d||!Array.isArray(d.objects)) return null;
  const objs=d.objects.slice(0,18).map(r=>cleanObj(r,{})).filter(Boolean);
  if(objs.length<2) return null;
  objs.forEach(o=>{
    o.x=clamp(o.x,20,980);o.y=clamp(o.y,20,980);
    if(o.type==='text'){if(o.w>860){o.size=Math.max(14,o.size*860/o.w);refreshText(o);}}
    else{o.w=Math.min(o.w,1000);o.h=Math.min(o.h,1000);}
  });
  return {name:String(d.name||'').trim().slice(0,24),bg:cleanHex(d.bg,'#ffffff'),objs};
}
const KIND_TXT={auto:'Kies zelf de beste soort logo.',emblem:'Het logo moet een embleem zijn: een ronde badge of schild met tekst en een icoon.',icon:'Het logo bestaat uit een duidelijk icoon met de merknaam ernaast of eronder.',word:'Het logo is een woordmerk: alleen de naam, in een krachtig lettertype.'};
const AI_KINDS=[['auto','Automatisch'],['emblem','Embleem'],['icon','Icoon en naam'],['word','Alleen tekst']];
const promptConcepts=(p,kind)=>`Je bent een ervaren logo-ontwerper. Bedenk 4 verschillende logo-concepten voor deze beschrijving:
"${p.replace(/"/g,"'")}"
${KIND_TXT[kind]||''}

Geef ALLEEN JSON terug in dit formaat:
{"concepts":[{"name":"merknaam (max 22 tekens)","slogan":"korte slogan of lege tekst (max 30 tekens)","style":"een van: ${STYLES.map(s=>s[0]).join(', ')}","icon":"een van: ${Object.keys(ICONLIB).join(', ')}","palette":{"bg":"#rrggbb","p1":"#rrggbb","p2":"#rrggbb","ac":"#rrggbb"},"why":"een zin in het Nederlands waarom dit past (max 90 tekens)"}]}

Betekenis van de stijlen: sport = stoer schild, elegant = fijne ringen en sierlijke letters, gamer = zeshoek met gloed, retro = burst met lint, minimal = strak en rustig, playful = kleurrijk en speels, nature = blad en ring, luxury = kroon en goud, emblem = ronde badge met gebogen tekst, wordmark = alleen de naam.
Regels: 4 concepten met verschillende stijl, icoon en kleuren. Gebruik de merknaam uit de beschrijving als die er is, anders verzin je een korte pakkende naam. Kies het icoon dat het best bij het merk past. bg is de achtergrond (wit of heel licht, of donker bij gamer en luxury). p1 is de hoofdkleur, p2 de tweede kleur en ac een accentkleur. Zorg voor goed contrast tussen bg en p1. Alle kleuren zijn 6-cijferige hex-codes.`;
const promptFree=(p,extra)=>`Ontwerp één logo op een vierkant canvas van 1000 bij 1000 pixels voor: "${p.replace(/"/g,"'")}".${extra?' '+extra:''}
Geef ALLEEN JSON terug: {"name":"merknaam","bg":"#rrggbb","objects":[...]}.

Je mag alleen deze onderdelen gebruiken.
Vorm: {"type":"shape","shape":"<een van: ${SHAPES.map(s=>s[0]).join(', ')}>","x":500,"y":500,"w":300,"h":300,"rot":0,"fill":{"t":"solid","c1":"#rrggbb"},"stroke":"#rrggbb","sw":0}. Voor een verloop gebruik je "fill":{"t":"grad","c1":"#rrggbb","c2":"#rrggbb","a":45}, zonder vulling "fill":{"t":"none"} (met een rand sw > 0).
Icoon (lijnicoon): {"type":"shape","shape":"icon","icon":"<een van: ${Object.keys(ICONLIB).join(', ')}>","x":500,"y":400,"w":260,"h":260,"p":2,"fill":{"t":"solid","c1":"#rrggbb"}}. De kleur van een icoon is fill.c1, p is de lijndikte (1 tot 3).
Tekst: {"type":"text","text":"NAAM","font":"<een van: ${FONTS.map(f=>f.n).join(', ')}>","size":140,"x":500,"y":700,"ls":0,"curve":0,"fill":{"t":"solid","c1":"#rrggbb"},"stroke":"#rrggbb","sw":0}.

x en y zijn het midden van het onderdeel. Onderdelen verderop in de lijst liggen bovenop. Maximaal 14 onderdelen en alles binnen 60 tot 940. Tekst moet goed leesbaar zijn (sterk contrast) en past binnen 800 pixels breed. Combineer een sterke vorm met een icoon en de naam tot een herkenbaar geheel (bijvoorbeeld een schild met een icoon en een lint met de naam, of een ring met gebogen tekst en een icoon in het midden). Gebruik "curve" (-100 tot 100) voor gebogen tekst, handig in badges. Beperk je tot 2 lettertypes en 3 tot 4 kleuren. Wees creatief maar netjes.`;

   ${a.err?`<p class="hint" style="color:var(--danger)">${esc(a.err)}</p>`:''}

function conceptStyle(c){return ai.kind==='emblem'?'emblem':ai.kind==='word'?'wordmark':ai.kind==='icon'?'minimal':c.style;}
function paintAI(){
  $$('canvas[data-cc]',$('#ai')).forEach(c=>{
    const k=c.dataset.cc;
    if(k[0]==='f'){const f=ai.frees[+k.slice(1)];if(f) paintPreview(c,f.objs,f.bg);}
    else{const cc=ai.concepts[+k];if(cc){const r=genLogo(cc.name,cc.slogan,conceptStyle(cc),cc.pal,cc.v||0,cc.icon);paintPreview(c,r.objs,r.bg);}}
  });
}
async function runAI(){
  const p=ai.prompt.trim();
  if(p.length<3){toast('Beschrijf eerst kort je merk.');return;}
  await fontsWait();
  ai.concepts=[];ai.frees=[];ai.err='';ai.local=false;
  const s=await getSample();
  if(!s){ai.local=true;ai.concepts=localConcepts(p);renderAI();return;}
  const ctl=new AbortController();ai.ctl=ctl;ai.busyC=true;ai.busyF=true;renderAI();
  const live=()=>ai.ctl===ctl;
  s.json(promptConcepts(p,ai.kind),{signal:ctl.signal,modelTier:'quick'}).then(d=>{
    const list=(d&&Array.isArray(d.concepts)?d.concepts:[]).slice(0,4).map(normConcept).filter(Boolean);
    if(!list.length) throw {code:'invalid_json'};
    if(live()) ai.concepts=list;
  }).catch(e=>{
    if(live()&&(!e||e.code!=='cancelled')){ai.err=aiMsg(e);ai.concepts=localConcepts(p);ai.local=false;}
  }).finally(()=>{if(live()){ai.busyC=false;renderAI();}});
  s.json(promptFree(p),{signal:ctl.signal}).then(d=>{const f=normFree(d);if(live()&&f) ai.frees.push(f);})
  .catch(()=>{}).finally(()=>{if(live()){ai.busyF=false;renderAI();}});
}
async function moreFree(){
  const p=ai.prompt.trim(),s=await getSample();if(!s||ai.busyF) return;
  await fontsWait();
  const ctl=new AbortController();ai.ctl=ctl;ai.busyF=true;renderAI();
  const live=()=>ai.ctl===ctl;
  s.json(promptFree(p,'Kies een andere aanpak dan een standaard schild: variatie is de bedoeling (variatie '+(ai.frees.length+1)+').'),{signal:ctl.signal,cache:false}).then(d=>{const f=normFree(d);if(live()&&f) ai.frees.push(f);})
  .catch(e=>{if(live()&&e&&e.code!=='cancelled') ai.err=aiMsg(e);}).finally(()=>{if(live()){ai.busyF=false;renderAI();}});
}
function pickConcept(i){
  const c=ai.concepts[i];if(!c) return;
  const r=genLogo(c.name,c.slogan,conceptStyle(c),c.pal,c.v||0,c.icon);
  openDoc({W:1000,H:1000,bg:r.bg,name:c.name,objs:r.objs},()=>{if(aiAvail()) setTimeout(()=>toast('Tip: vraag de AI-assistent (✨ rechtsboven) om nog iets aan te passen.',4000),1800);});
}
function pickFree(i){
  const f=ai.frees[i];if(!f) return;
  openDoc({W:1000,H:1000,bg:f.bg,name:f.name||'AI-logo',objs:f.objs});
}
$('#ai').addEventListener('input',e=>{if(e.target.id==='aip') ai.prompt=e.target.value;});
$('#ai').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b) return;
  const a=b.dataset.a,i=+b.dataset.i;
  if(a==='close'){if(ai.ctl){try{ai.ctl.abort();}catch(x){}ai.ctl=null;}$('#ai').hidden=true;}

async function aiWrite(o,instr){
